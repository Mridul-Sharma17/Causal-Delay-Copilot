[project]
name = "causal-delay-copilot"
version = "0.1.0"
description = "A contract-first causal delay investigation Core."
requires-python = "==3.12.13"
dependencies = [
    "dowhy==0.14",
    "doubleml==0.11.3",
    "econml==0.16.0",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "joblib==1.5.3",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pydantic-settings==2.13.1",
    "pyarrow==23.0.1",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "shap==0.48.0",
    "statsmodels==0.14.6",
    "threadpoolctl==3.6.0",
    "uvicorn[standard]==0.41.0",
]

[dependency-groups]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["backend/tests"]
